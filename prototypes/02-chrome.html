<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>02 液態鉻 原型</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Manrope:wght@500;700&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
.app{--mut:#a9b0bd;--ice:#a8e6ff;--lil:#c9b6ff;color:#eef1f6;font-family:Manrope,-apple-system,"PingFang TC",sans-serif;background:radial-gradient(90% 50% at 50% 0%,#2a2e38 0%,#121419 60%),#0e1014}
.screen{padding:max(env(safe-area-inset-top),52px) 0 120px}
.wrap{padding:0 22px}
.chrome-t{font-family:Unbounded,sans-serif;font-weight:800;letter-spacing:-.02em;background:linear-gradient(180deg,#fff 0%,#c9ced6 38%,#6d737e 52%,#e9edf3 70%,#9aa1ad 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.top{display:flex;justify-content:space-between;align-items:flex-end;padding:0 22px}
.top h1{margin:2px 0 0;font-size:36px}
.sub{font-size:13px;color:var(--mut)}
.knob{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(145deg,#3a3f4a,#1b1e25);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 16px rgba(0,0,0,.5)}
.track{display:flex;gap:0;overflow-x:auto;scroll-snap-type:x mandatory;padding:26px calc(50% - 138px) 20px;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.card{flex:0 0 276px;height:400px;scroll-snap-align:center;border-radius:32px;padding:3px;margin:0 -14px;background:linear-gradient(135deg,#fff 0%,#8d94a0 22%,#f1f4f8 45%,#5d636e 70%,#e6eaf0 100%);box-shadow:0 30px 60px rgba(0,0,0,.6);transition:transform .08s linear;text-align:left}
.card .in{display:flex;flex-direction:column;height:100%;border-radius:29px;overflow:hidden;background:#15171d}
.card .art{position:relative;height:240px}
.card .art::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 60% at 30% 30%,rgba(255,255,255,.5),transparent 60%),linear-gradient(to top,rgba(21,23,29,.95),transparent 55%)}
.card .day{position:absolute;left:18px;bottom:12px;z-index:1;font:800 46px/1 Unbounded,sans-serif}
.card .day small{font:500 13px Manrope,sans-serif;margin-left:6px;color:#d7dbe3}
.card .meta{padding:14px 18px;display:flex;flex-direction:column;gap:4px}
.card .ar{font-size:21px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .vn{font-size:14px;color:var(--mut)}
.pips{display:flex;gap:6px;margin-top:6px}
.pips i{width:12px;height:12px;border-radius:6px;background:#3a3f4a}
.pips i.on{background:linear-gradient(145deg,#fff,#8d94a0)}
.badge{position:absolute;top:14px;left:14px;z-index:1;padding:4px 10px;border-radius:12px;font-size:11px;font-weight:700;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.3)}
.dots{display:flex;justify-content:center;gap:6px}
.dots span{width:6px;height:6px;border-radius:3px;background:#4a4f59;transition:width .2s}
.dots span.on{width:22px;background:#eef1f6}
.cap{margin:22px 22px 0;padding:14px 16px;border-radius:22px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;gap:14px;width:calc(100% - 44px);text-align:left}
.cap .dd{width:52px;height:52px;border-radius:16px;background:linear-gradient(145deg,var(--lil),var(--ice));color:#12141a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Unbounded,sans-serif}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 22px}
.tile{border-radius:22px;padding:2px;background:linear-gradient(135deg,#fff,#6d737e,#dfe3ea,#4a4f59);text-align:left}
.tile .in{border-radius:20px;overflow:hidden;background:#15171d}
.tile .art{height:110px;position:relative}
.tile .art b{position:absolute;left:10px;bottom:8px;font:800 26px Unbounded,sans-serif}
.tile .t{padding:8px 10px 10px;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .t small{display:block;font-weight:500;color:var(--mut);font-size:12px}
.search{margin:16px 22px;display:flex;align-items:center;gap:8px;padding:0 16px;border-radius:24px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14)}
.search input{flex:1;min-height:48px;background:none;border:0;outline:0}
.glass{margin:0 22px 12px;padding:16px;border-radius:22px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.big{font:800 40px Unbounded,sans-serif}
.bar{height:10px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--lil),var(--ice))}
nav.pill{position:absolute;left:50%;bottom:max(env(safe-area-inset-bottom),24px);transform:translateX(-50%);z-index:20;width:290px;height:68px;border-radius:34px;display:flex;align-items:center;justify-content:space-around;background:rgba(40,44,54,.75);border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 18px 40px rgba(0,0,0,.6);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
nav.pill button{width:48px;height:48px;display:grid;place-items:center;color:var(--mut);border-radius:24px}
nav.pill button[aria-current]{color:#fff;background:rgba(255,255,255,.1)}
nav.pill .add{width:56px;height:56px;border-radius:28px;color:#12141a;background:linear-gradient(145deg,#fff,#b9c0cb 50%,#eef1f6);box-shadow:0 4px 14px rgba(168,230,255,.35)}
.case{position:relative;height:240px;margin:16px 0 0}
.disc{position:absolute;left:150px;top:14px;width:200px;height:200px;border-radius:100px;background:conic-gradient(#d9dee6,#a8e6ff,#c9b6ff,#ffd6f5,#b7ffe9,#f1f4f8,#a8e6ff,#d9dee6);box-shadow:0 20px 40px rgba(0,0,0,.6);animation:spin 9s linear infinite}
.disc::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 3px,rgba(255,255,255,.08) 3px 4px)}
.disc::after{content:"";position:absolute;left:80px;top:80px;width:40px;height:40px;border-radius:20px;background:#0e1014;border:6px solid #c9ced6;box-sizing:border-box}
@keyframes spin{to{transform:rotate(360deg)}}
.jewel{position:absolute;left:22px;top:0;width:220px;height:220px;border-radius:18px;padding:2px;background:linear-gradient(135deg,#fff,#8d94a0 25%,#f1f4f8 50%,#5d636e 75%,#e6eaf0);box-shadow:0 24px 50px rgba(0,0,0,.6)}
.jewel div{width:100%;height:100%;border-radius:16px;display:flex;align-items:flex-end;padding:14px;box-sizing:border-box;font:800 26px/1 Unbounded,sans-serif}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips span{padding:6px 12px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-size:13px}
.chips .hi{background:linear-gradient(145deg,var(--lil),var(--ice));color:#12141a;font-weight:700;border:0}
.row{display:flex;align-items:center;gap:14px;min-height:46px;border-bottom:1px solid rgba(255,255,255,.08)}
.row:last-child{border:0}
.row span:first-child{font:12px Unbounded,sans-serif;color:#8d94a0;width:22px}
.row .e{width:22px;height:22px;border-radius:11px;display:grid;place-items:center;color:#12141a!important;background:linear-gradient(145deg,var(--lil),var(--ice))}
.sheet .panel{background:#16181e;border-radius:28px 28px 0 0;padding:10px 20px}
.grab{width:40px;height:5px;border-radius:3px;background:#4a4f59;margin:0 auto 10px}
.f{display:flex;flex-direction:column;gap:12px}
.f label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mut)}
.f input,.f textarea{min-height:48px;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:#eef1f6}
.f input:focus,.f textarea:focus{outline:0;border-color:var(--ice)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rate{display:flex;gap:6px}
.rate input{position:absolute;opacity:0}
.rate label{width:44px;height:44px;border-radius:22px;background:#2a2e38}
.rate input:checked+label{background:linear-gradient(145deg,#fff,#8d94a0)}
.pbtn{min-height:48px;padding:0 20px;border-radius:24px;font-weight:700}
.pbtn.solid{color:#12141a;background:linear-gradient(145deg,#fff,#b9c0cb 50%,#eef1f6)}
.toast{border-radius:16px;background:rgba(40,44,54,.95);border:1px solid rgba(255,255,255,.2);font-size:14px}
</style>
</head>
<body>
<a class="proto-home" href="index.html">← 全部原型</a>
<div class="app">
  <main class="screen" data-screen="home">
    <div class="top"><div><div class="sub">你的現場收藏</div><h1 class="chrome-t">ENCORE</h1></div><button class="knob" data-go="library" aria-label="搜尋"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#eef1f6" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button></div>
    <div class="track" id="track"></div>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <div id="upnext"></div>
  </main>

  <main class="screen" data-screen="library">
    <div class="top"><div><div class="sub">全部場次</div><h1 class="chrome-t">LIBRARY</h1></div></div>
    <label class="search"><span class="sr">搜尋</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a9b0bd" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="藝人、場館、歌曲"></label>
    <div class="grid" id="grid"></div>
  </main>

  <main class="screen" data-screen="stats">
    <div class="top"><div><div class="sub">你的現場數據</div><h1 class="chrome-t">STATS</h1></div></div>
    <div id="sbody" style="margin-top:18px"></div>
  </main>

  <main class="screen" data-screen="detail" id="detail"></main>

  <nav class="pill" data-nav aria-label="主要分頁">
    <button data-go="home" aria-label="首頁"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="4" width="14" height="16" rx="3"/><path d="M2 7v10M22 7v10"/></svg></button>
    <button data-go="library" aria-label="收藏"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg></button>
    <button class="add" data-sheet="add" aria-label="新增演唱會"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <button data-go="stats" aria-label="統計"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></button>
  </nav>

  <div class="sheet" id="add" role="dialog" aria-modal="true" aria-label="新增演唱會">
    <div class="scrim" data-close></div>
    <div class="panel">
      <div class="grab"></div>
      <form class="f" data-add>
        <div style="display:flex;justify-content:space-between;align-items:center"><button type="button" class="pbtn" data-close>取消</button><b>新增現場</b><button class="pbtn solid">儲存</button></div>
        <label>藝人 *<input name="artist" placeholder="例：YOASOBI"></label>
        <label>巡演名稱<input name="tour"></label>
        <div class="two"><label>日期 *<input name="date" type="date"></label><label>場館<input name="venue"></label></div>
        <div><div style="font-size:13px;color:var(--mut);margin-bottom:6px">評分</div>
          <div class="rate" role="radiogroup" aria-label="評分"><input type="radio" name="rating" value="1" id="r1"><label for="r1" aria-label="1 分"></label><input type="radio" name="rating" value="2" id="r2"><label for="r2" aria-label="2 分"></label><input type="radio" name="rating" value="3" id="r3"><label for="r3" aria-label="3 分"></label><input type="radio" name="rating" value="4" id="r4"><label for="r4" aria-label="4 分"></label><input type="radio" name="rating" value="5" id="r5"><label for="r5" aria-label="5 分"></label></div></div>
        <label>歌單（一行一首，安可前輸入 ENCORE）<textarea name="setlistText" rows="4"></textarea></label>
      </form>
    </div>
  </div>
  <div class="toast" role="status" aria-live="polite"></div>
</div>
<script src="shared.js"></script>
<script>
const { esc } = P;
const ART = {
  c: 'conic-gradient(from 210deg at 60% 45%,#a8e6ff,#c9b6ff,#ffd6f5,#b7ffe9,#a8e6ff)',
  m: 'conic-gradient(from 120deg at 40% 40%,#ffd6f5,#c9b6ff,#7f8cff,#a8e6ff,#ffd6f5)',
  y: 'conic-gradient(from 30deg at 50% 60%,#fff3c4,#b7ffe9,#a8e6ff,#d9dee6,#fff3c4)'
};
const pips = (n) => `<span class="pips">${[1, 2, 3, 4, 5].map((i) => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</span>`;
let refresh;
function render() {
  const items = P.list().filter((s) => s.status !== 'wish');
  document.getElementById('track').innerHTML = items.map((s) => { const p = P.parts(s.date); return `
    <button class="card" data-open="${s.id}" aria-label="${esc(s.artist)}"><span class="in">
      <span class="art" style="background:${ART[s.hue]}"><span class="badge">${P.STATUS[s.status]}</span><span class="day">${p.d}<small>${p.mon} ${p.y}</small></span></span>
      <span class="meta"><span class="ar">${esc(s.artist)}</span><span class="vn">${esc(s.venue)} · ${esc(s.seat)}</span>${s.rating ? pips(s.rating) : ''}</span>
    </span></button>`; }).join('');
  const track = document.getElementById('track');
  refresh = P.coverflow(track, document.getElementById('dots'));
  const n = P.next();
  document.getElementById('upnext').innerHTML = n ? `<button class="cap" data-open="${n.id}"><span class="dd"><b style="font-size:18px;line-height:1" id="cdd"></b><small style="font-size:9px">DAYS</small></span><span style="flex:1;min-width:0"><span class="sub" style="display:block">即將到來</span><b style="display:block;font-size:16px">${esc(n.artist)}</b><span class="sub">${P.parts(n.date).md} · ${esc(n.venue)}</span></span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a9b0bd" stroke-width="2" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>` : '';
  if (n) document.getElementById('cdd').textContent = P.countdown(n).d;
  renderGrid(); renderStats();
}
function renderGrid() {
  document.getElementById('grid').innerHTML = P.list('all', document.getElementById('q').value).map((s) => `
    <button class="tile" data-open="${s.id}"><span class="in" style="display:block"><span class="art" style="display:block;background:${ART[s.hue]}"><b style="color:#12141a">${P.parts(s.date).d}</b></span><span class="t" style="display:block">${esc(s.artist)}<small>${s.date.replace(/-/g, '.')}</small></span></span></button>`).join('') || '<p class="sub" style="grid-column:1/3">找不到符合的場次</p>';
}
function renderStats() {
  const st = P.stats(); const max = Math.max(...st.topArtists.map((a) => a[1]));
  document.getElementById('sbody').innerHTML = `
    <div class="glass" style="display:flex;justify-content:space-between"><div><div class="big chrome-t">${st.total}</div><div class="sub">場現場</div></div><div><div class="big chrome-t">${st.songs}</div><div class="sub">首現場歌曲</div></div></div>
    <div class="glass"><div class="sub" style="margin-bottom:8px">最常看的藝人</div>${st.topArtists.slice(0, 4).map(([a, v]) => `<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:14px"><span>${esc(a)}</span><span class="sub">${v}</span></div><div class="bar"><i style="width:${v / max * 100}%"></i></div></div>`).join('')}</div>
    <div class="glass" style="display:flex;justify-content:space-between"><div><div class="sub">平均評分</div><div class="big">${st.avg}</div></div><div style="text-align:right"><div class="sub">票券總花費</div><div class="big" style="font-size:24px;margin-top:12px">${st.spend.toLocaleString()}</div></div></div>`;
}
function detail(id) {
  const s = P.get(id);
  document.getElementById('detail').innerHTML = `
    <div class="wrap" style="display:flex;justify-content:space-between"><button class="knob" data-back aria-label="返回"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#eef1f6" stroke-width="2" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button><button class="pbtn solid" data-toast="原型：編輯畫面">編輯</button></div>
    <div class="case" aria-hidden="true"><div class="disc"></div><div class="jewel"><div style="background:${ART[s.hue]};color:#12141a">${esc(s.artist.split(' ')[0])}</div></div></div>
    <div class="wrap" style="margin-top:12px"><h2 style="margin:0;font-size:26px">${esc(s.artist)}</h2><div class="sub">${esc(s.tour)}</div>
      <div class="chips"><span>${s.date.replace(/-/g, '.')}</span>${s.venue ? `<span>${esc(s.venue)}</span>` : ''}${s.seat ? `<span>${esc(s.seat)}</span>` : ''}${s.rating ? `<span class="hi">${s.rating}.0 / 5</span>` : `<span>${P.STATUS[s.status]}</span>`}</div></div>
    ${P.songs(s) ? `<div class="glass" style="margin-top:16px">${s.setlist.map((t, i) => `<div class="row"><span>${P.pad(i + 1)}</span><span>${esc(t)}</span></div>`).join('')}${s.encore.map((t) => `<div class="row"><span class="e">E</span><span style="flex:1">${esc(t)}</span><span class="sub">安可</span></div>`).join('')}</div>` : ''}
    ${s.notes ? `<div class="glass">${esc(s.notes)}</div>` : ''}`;
}
document.getElementById('q').addEventListener('input', renderGrid);
P.init({ render, detail, onGo: (n) => { document.querySelector('nav.pill').style.display = n === 'detail' ? 'none' : ''; if (n === 'home' && refresh) requestAnimationFrame(refresh); } });
</script>
</body>
</html>
